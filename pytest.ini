[pytest]
# Набор запускается из корня репозитория одной командой без аргументов —
# так же, как его зовёт CI, чтобы «у меня локально зелено» значило то же самое.
testpaths = tests
python_files = test_*.py

# scripts/ в пути: скрипты импортируют друг друга по короткому имени
# (build_ui → from prompts import …). Дублируется в tests/conftest.py на
# случай запуска отдельного файла из другой папки.
pythonpath = . scripts

# --strict-markers и --strict-config: опечатка в имени маркера или в секции
# конфига должна падать, а не тихо отключать проверку. -ra печатает причины
# пропусков — пропущенный тест обязан быть виден, иначе он неотличим от
# пройденного, а половина набора пропускается штатно (нет кадров, нет второй
# раскадровки).
#
# -p no:cacheprovider: кэш прогонов — состояние конкретной машины, а не проект;
# в репозитории, где рядом лежат кадры и вердикты, ещё один служебный каталог
# только мешает читать `git status`.
addopts = -q -ra --strict-markers --strict-config -p no:cacheprovider

# xfail без падения — это забытый тест. Пусть краснеет.
xfail_strict = true
